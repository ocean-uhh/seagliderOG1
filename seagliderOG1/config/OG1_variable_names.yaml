################################################################################
# OG1 VARIABLE AND SENSOR MAPPING CONFIGURATION
#
# Purpose: Converts local dataset variables and sensor names into the
# OceanGlider 1 (OG1) standard format.
#
# Logic:
# Variables are renamed from raw internal names to OG1-compliant keys. Only
# variable names belong here: sensor keys are in OG1_sensor_names.yaml, because
# every entry in this file is applied as a variable rename.
################################################################################
#### VARIABLE RENAMING (Raw -> OG1 Standard) ####
#### Official OG1 variable names are listed here: https://vocab.nerc.ac.uk/collection/OG1/current/ ####
latitude: LATITUDE
longitude: LONGITUDE
gps_lat: LATITUDE_GPS
gps_lon: LONGITUDE_GPS
gps_time: TIME_GPS
ctd_time: TIME
time: TIME
delta_time_s: DELTA_TIME_S
eng_pitchAng: PITCH
eng_rollAng: ROLL
eng_head: HEADING
ctd_depth: DEPTH
depth: DEPTH
pressure: PRES
ctd_pressure: PRES
conductivity: CNDC
trajectory: TRAJECTORY
# dissolved_oxygen (sbe43, after sensor-prefix strip) is per-mass micromoles/kg; OG1 DOXY is
# mmol m-3 (per volume), a different quantity that needs density to derive. The basestation value
# is not mapped to DOXY -- it passes through under its own name; DOXY is derived in a later release
# (feat/derived-variables). dissolved_oxygen_sat is a per-mass saturation concentration, not OG1
# OXYSAT's percent saturation, so it is not mapped either. See drop recommendations.
O2_sat: OXYSAT
oxygen_concentration: DOXY
chlorophyll: CHLA
sigma_theta: SIGTHETA
sigma_t: SIGMA_T
temperature: TEMP
temp: TEMP
temperature_raw: TEMP_RAW
salinity_raw: PSAL_RAW
conductivity_raw: CNDC_RAW
salinity: PSAL
absolute_salinity: SA
conservative_temperature: CT
ctd_density: DENSITY
density_insitu: DENSITY
profile_index: PROFILE_NUMBER
divenum: DIVE_NUMBER
platform: PLATFORM_MODEL
source: PLATFORM_SERIAL_NUMBER
vert_speed: GLIDER_VERT_VELO_MODEL
horz_speed: GLIDER_HORZ_VELO_MODEL
speed: GLIDE_SPEED
glide_angle: GLIDE_ANGLE
depth_avg_curr_east: DAVG_CURR_EAST
depth_avg_curr_north: DAVG_CURR_NORTH
depth_avg_curr_qc: DAVG_CURR_EAST_QC
adcp_Pressure: PRES_ADCP
blueRef: BBP470_REF
redRef: BBP700_REF
VFtemp: BBP_VFTEMP ### What is the correct variable name for this?
tempFreq: TEMP_FREQ ### What is the correct variable name for this?
O2Freq: O2_FREQ ### What is the correct variable name for this?
condFreq: COND_FREQ ### What is the correct variable name for this?
particulate_backscatter: BBP700
backscatter_scaled: BBP700
backscatter_raw: RBBP700
chla470: CHLA
fdom365: CDOM
potential_temperature: THETA
O2_saturation: OXYSAT
theta: THETA
down_irradiance_380: ED380
down_irradiance_490: ED490
downwelling_PAR: DPAR
temperature_oxygen: TEMP_OXYGEN
potential_density: POTDENS0
# gsw_sigma0 is the density anomaly (sigma0 = potential density - 1000); OG1 POTDENS0 is full
# potential density, so gsw_sigma0 is not mapped here (it would be ~1000 out of range). It passes
# through under its own name; POTDENS0 is derived in a later release. See drop_variables and the
# conversion page's drop recommendation.
chlorophyll_raw: FLUOCHLA
fluorCount: FLUOCHLA
ad2cp_pitch: AD2CP_PITCH
ad2cp_roll: AD2CP_ROLL
ad2cp_heading: AD2CP_HEADING
ad2cp_pressure: AD2CP_PRES
turbidity: TURB
cdom: CDOM
cdom_raw: FLUOCDOM
phycoerythrin: PHYC
phycoerythrin_raw: FLUOPHYC
tke_dissipation_shear_1: EPSIFY01
tke_dissipation_shear_2: EPSIFY02
east_displacement: EAST_DISPLACEMENT
north_displacement: NORTH_DISPLACEMENT
eng_pitchCtl: PITCH_CTL
eng_rollCtl: ROLL_CTL
eng_vbdCC: VBD_CC
buoyancy: BUOYANCY
sound_velocity: SOUND_VELOCITY

### flight model parameters ###
sg_cal_vbd_min_cnts: VBD_MIN_CNTS
sg_cal_vbd_cnts_per_cc: VBD_CNTS_PER_CC
log_VBD_CNV: VBD_CC_PER_CNTS
sg_cal_mass: MASS
sg_cal_volmax: VOLMAX
log_C_VBD: C_VBD
sg_cal_hd_a: HD_A
sg_cal_hd_b: HD_B
sg_cal_hd_c: HD_C
sg_cal_vbdbias: VBD_BIAS
