name: Run tests

on:
  push:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml', 'tests/**', 'scripts/**']
  pull_request:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml', 'tests/**', 'scripts/**']

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.14", experimental: true }
          - { os: macos-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.11" }
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary

      - if: runner.os != 'Windows'
        run: pytest --durations=30
      # On Windows the netCDF4 wheel points HDF5 at its bundled filter plugins, and HDF5
      # rescans that folder on every filter query: xarray queries each variable, so one
      # OG1 file open took ~1.9 s (36 ms per variable) instead of ~0.03 s. The package
      # writes zlib, which is built in, so the tests need no plugins.
      - if: runner.os == 'Windows'
        env:
          HDF5_PLUGIN_PRELOAD: "::"
        run: pytest --durations=30

  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install ruff==0.16.4
      - run: ruff check .
      - run: ruff format --check .

  coverage:
    name: Coverage gate / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary
      - run: pytest --cov=seagliderOG1 --cov-report=term-missing --cov-fail-under=87

  og1-compliance:
    # The OG1 checker (cc-plugin-og) on the converted sg271 sample. Fails on any finding not
    # in tests/data/og1_known_findings.txt; the list shrinks as fixes land. The checker is not
    # a package dependency: users do not need it to convert. The version is pinned so a new
    # cc-plugin-og release cannot turn this red on an unrelated PR; og1-drift.yml runs the latest
    # release monthly to catch one. On a bump, re-pin here and regenerate the known list against it.
    name: OG1 compliance (cc-plugin-og) / ubuntu / Py 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e . "cc-plugin-og==0.1.2" --prefer-binary
      - run: |
          mkdir -p og1-check && cd og1-check
          seagliderOG1 init --example sg271.yaml
          seagliderOG1 process sg271.yaml
      - run: python scripts/check_og1.py og1-check/sg271_*.nc tests/data/og1_known_findings.txt
