name: Run tests

on:
  push:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml']
  pull_request:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml']

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.14", experimental: true }
          - { os: macos-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.11" }
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary

      # Diagnostic (Windows only): per-variable netCDF4 call cost and two HDF5 plugin
      # settings. Remove this step once the cause is known.
      - name: Time netCDF4 filter queries (diagnostic)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tempfile

          # Each case runs in a fresh interpreter: HDF5 reads its plugin settings when it loads.
          probe = """
          import time, netCDF4, xarray as xr
          p = "data/demo_single_test.nc"
          nc = netCDF4.Dataset(p)
          variables = list(nc.variables.values())
          for meth in ("filters", "chunking", "ncattrs"):
              t = time.perf_counter()
              for var in variables:
                  getattr(var, meth)()
              print(f"  {meth}: {(time.perf_counter() - t) * 1e3 / len(variables):.2f} ms per variable")
          nc.close()
          t = time.perf_counter()
          xr.open_dataset(p, engine="netcdf4").close()
          print(f"  xarray open: {time.perf_counter() - t:.3f} s")
          print("  HDF5_PLUGIN_PATH =", repr(__import__('os').environ.get('HDF5_PLUGIN_PATH')))
          """

          empty = tempfile.mkdtemp()
          cases = [
              ("as installed", {}),
              ("HDF5_PLUGIN_PRELOAD='::' (no dynamic filter plugins)", {"HDF5_PLUGIN_PRELOAD": "::"}),
              ("HDF5_PLUGIN_PATH = an empty directory", {"HDF5_PLUGIN_PATH": empty}),
          ]
          for label, extra in cases:
              print(label)
              env = {**os.environ, **extra}
              result = subprocess.run([sys.executable, "-c", probe], env=env, capture_output=True, text=True)
              print(result.stdout.rstrip() or result.stderr.strip()[-800:])

      - run: pytest --durations=30

  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install ruff==0.16.4
      - run: ruff check .
      - run: ruff format --check .

  coverage:
    name: Coverage gate / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary
      - run: pytest --cov=seagliderOG1 --cov-report=term-missing --cov-fail-under=82
