name: Run tests

on:
  push:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml']
  pull_request:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml']

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.14", experimental: true }
          - { os: macos-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.11" }
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary

      # Diagnostic (Windows only): where xarray spends an OG1 file open.
      # Remove this step once the cause is known.
      - name: Profile an xarray open (diagnostic)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import cProfile
          import io
          import pstats
          import time

          import xarray as xr

          p = "data/demo_single_test.nc"


          def timed(label, **kwargs):
              t = time.perf_counter()
              for _ in range(3):
                  xr.open_dataset(p, engine="netcdf4", **kwargs).close()
              print(f"{label}: {(time.perf_counter() - t) / 3:.3f} s per open")


          timed("xarray open")
          timed("xarray open, decode_times=False", decode_times=False)
          timed("xarray open, decode_cf=False", decode_cf=False)

          profile = cProfile.Profile()
          profile.enable()
          for _ in range(3):
              xr.open_dataset(p, engine="netcdf4").close()
          profile.disable()
          for order in ("tottime", "cumulative"):
              out = io.StringIO()
              pstats.Stats(profile, stream=out).sort_stats(order).print_stats(20)
              print(out.getvalue())

      - run: pytest --durations=30

  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install ruff==0.16.4
      - run: ruff check .
      - run: ruff format --check .

  coverage:
    name: Coverage gate / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary
      - run: pytest --cov=seagliderOG1 --cov-report=term-missing --cov-fail-under=82
