name: Run tests

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.ipynb'
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - '**.ipynb'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full supported range on Ubuntu; one version (3.11) on Windows and macOS.
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12", coverage: true }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.11" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Check Package Installation
        shell: bash -l {0}
        run: |
          micromamba run -n TEST micromamba env list
          micromamba run -n TEST micromamba list
          micromamba run -n TEST python -m pip check

      - name: Install package (editable)
        shell: bash -l {0}
        run: |
          micromamba run -n TEST python -m pip install --upgrade pip
          micromamba run -n TEST python -m pip install -e . --no-deps --force-reinstall

      - name: Run tests
        shell: bash -l {0}
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            micromamba run -n TEST python -m pytest --cov=seagliderOG1 --cov-report=term-missing --cov-fail-under=45 tests/
          else
            micromamba run -n TEST python -m pytest tests/
          fi
