name: Run tests

on:
  push:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml']
  pull_request:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml']

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.14", experimental: true }
          - { os: macos-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.11" }
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary
      - run: python -m pip install ruff && ruff check .
      - run: pytest

  coverage:
    name: Coverage gate / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary
      - run: pytest --cov=seagliderOG1 --cov-report=term-missing --cov-fail-under=75
