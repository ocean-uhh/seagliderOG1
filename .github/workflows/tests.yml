name: Run tests

on:
  push:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml']
  pull_request:
    branches: [ "main" ]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/**', 'seagliderOG1/**/*.yaml', 'seagliderOG1/**/*.yml']

jobs:
  test:
    name: ${{ matrix.os }} / Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.14", experimental: true }
          - { os: macos-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.11" }
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary

      # Diagnostic (Windows only): time netCDF opens, turn off real-time scanning,
      # time them again. Remove these three steps once the cause is known.
      - name: Time netCDF opens (diagnostic)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import time
          import netCDF4
          import xarray as xr
          for p in ("data/demo_sg005/p0050001_20080606.nc", "data/demo_single_test.nc"):
              t = time.perf_counter()
              for _ in range(5):
                  netCDF4.Dataset(p).close()
              a = (time.perf_counter() - t) / 5
              t = time.perf_counter()
              for _ in range(5):
                  xr.open_dataset(p, engine="netcdf4", decode_timedelta=False).close()
              b = (time.perf_counter() - t) / 5
              print(f"{p}: netCDF4 {a:.3f} s, xarray {b:.3f} s per open")
      - name: Turn off real-time scanning (diagnostic)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Time netCDF opens again (diagnostic)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import time
          import xarray as xr
          for p in ("data/demo_sg005/p0050001_20080606.nc", "data/demo_single_test.nc"):
              t = time.perf_counter()
              for _ in range(5):
                  xr.open_dataset(p, engine="netcdf4", decode_timedelta=False).close()
              b = (time.perf_counter() - t) / 5
              print(f"{p}: xarray {b:.3f} s per open")

      - run: pytest --durations=30

  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install ruff==0.16.4
      - run: ruff check .
      - run: ruff format --check .

  coverage:
    name: Coverage gate / ubuntu / Py 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --prefer-binary
      - run: pytest --cov=seagliderOG1 --cov-report=term-missing --cov-fail-under=82