name: Deploy Documentation

on:
  push:
    branches:
      - main
  # Optional: manual trigger
  workflow_dispatch:

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: pip install --upgrade pip && pip install -e ".[docs]"
      - run: jupyter nbconvert --to notebook --execute notebooks/demo.ipynb --output=demo-output.ipynb --output-dir=docs/source
      - run: mkdir -p docs/source/_static/demo && cp outputs/sg271_20260302T193828_R_conversion.html docs/source/_static/demo/conversion.html
      - run: cd docs && make clean html SPHINXOPTS="-W"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
