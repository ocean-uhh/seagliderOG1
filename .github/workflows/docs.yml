name: Test documentation build

on:
  pull_request:
    paths:
      - '**.py'
      - '**.ipynb'
      - '**.rst'
      - '**.md'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - uses: r-lib/actions/setup-pandoc@v2
      - run: pip install --upgrade pip && pip install -e ".[docs]"
      - run: jupyter nbconvert --to notebook --execute notebooks/demo.ipynb --output=demo-output.ipynb --output-dir=docs/source
      - run: cd docs && make clean html SPHINXOPTS="-W"   # the html target regenerates the hosted report
