[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "setuptools-scm[toml]>=3.4",
  "wheel",
]

[project]
name = "seagliderOG1"
description = "Convert from Seaglider basestation to OG1 format"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
  { name = "Till Moritz", email = "till.moritz@uni-hamburg.de" }
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dynamic = [
  "version",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.1",
  "xarray>=2025.1.1",
  "netCDF4>=1.6",
  "gsw>=3.6",
  "matplotlib>=3.6",
  "tqdm>=4.65",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "PyYAML>=6",
]
urls.documentation = "https://ocean-uhh.github.io/seagliderOG1"
urls.homepage = "https://github.com/ocean-uhh/seagliderOG1"
urls.repository = "https://github.com/ocean-uhh/seagliderOG1"
urls."Bug Tracker" = "https://github.com/ocean-uhh/seagliderOG1/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
docs = [
  "sphinx>=7.2",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0",
  "nbsphinx>=0.9",
  "nbconvert>=7.8",
  "ipykernel",
]
dev = ["seagliderOG1[test,docs]", "ruff>=0.3"]

[project.scripts]
seagliderOG1 = "seagliderOG1.cli:main"

[tool.setuptools]
packages = [
  "seagliderOG1",
  "seagliderOG1.cli",
]
include-package-data = true

[tool.setuptools.package-data]
seagliderOG1 = ["config/*.yaml", "config/*.yml"]

[tool.setuptools_scm]
write_to = "seagliderOG1/_version.py"
write_to_template = "__version__ = '{version}'"
tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]


[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
target-version = "py310"
# …any other top‑level settings you use (extend, cache-dir, line-length, exclude, etc.)…

[tool.ruff.lint]
select = [
  "D",       # pydocstyle
  "E",       # pycodestyle errors
  "F",       # pyflakes errors
  "W",       # pycodestyle warnings
  "C90",     # mccabe complexity
  "ANN",     # type annotations
  "B",       # flake8-bugbear
  "BLE",     # bleach checks
  "TRY",     # tryceratops
  "ARG",     # flake8-arguments
  "SLF",     # flake8-self
]
ignore = [
  "D107",    # missing docstring in __init__
  "D203",    # 1 blank line required before class docstring
  "D213",    # multi-line summary docstring style
  "D401",    # first line should be in imperative mood
  "E501",    # line‑length
  "PLR0913", # too many arguments
  "C901",    # complexity
]
